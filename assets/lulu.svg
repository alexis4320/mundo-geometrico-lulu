<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c9dc"/>
      <stop offset="1" stop-color="#e99cbe"/>
    </linearGradient>
  </defs>

  <!-- Lulu is inspired by the child's drawing:
       round head, circular belly, triangular ears/arms/feet,
       simple friendly face and a pink accent palette. -->

  <!-- ears -->
  <polygon points="42,68 76,25 91,86" fill="#f4a7c7" stroke="#4d4d4d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="258,68 224,25 209,86" fill="#f4a7c7" stroke="#4d4d4d" stroke-width="6" stroke-linejoin="round"/>

  <!-- arms -->
  <polygon points="54,180 8,160 38,206 76,205" fill="#f4a7c7" stroke="#4d4d4d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="246,180 292,160 262,206 224,205" fill="#f4a7c7" stroke="#4d4d4d" stroke-width="6" stroke-linejoin="round"/>

  <!-- legs -->
  <polygon points="91,295 62,337 112,315 127,281" fill="#f4a7c7" stroke="#4d4d4d" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="209,295 238,337 188,315 173,281" fill="#f4a7c7" stroke="#4d4d4d" stroke-width="6" stroke-linejoin="round"/>

  <!-- body -->
  <rect x="67" y="150" width="166" height="155" rx="55" fill="url(#body)" stroke="#4d4d4d" stroke-width="7"/>

  <!-- belly: geometric circle -->
  <circle cx="150" cy="226" r="47" fill="#fff4f8" stroke="#4d4d4d" stroke-width="5"/>

  <!-- head -->
  <circle cx="150" cy="105" r="91" fill="url(#body)" stroke="#4d4d4d" stroke-width="7"/>

  <!-- face -->
  <circle cx="117" cy="95" r="7" fill="#333"/>
  <circle cx="183" cy="95" r="7" fill="#333"/>
  <ellipse cx="150" cy="122" rx="22" ry="16" fill="#8b5e66"/>
  <path d="M140 129 Q150 138 160 129" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>

  <!-- little geometric belly mark -->
  <polygon points="150,198 174,221 150,245 126,221" fill="#f4a7c7" opacity=".9"/>
</svg>
